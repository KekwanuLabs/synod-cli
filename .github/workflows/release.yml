name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'

jobs:
  check-version:
    name: Check for Version Change
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get current version
        id: version
        run: |
          VERSION=$(grep -m1 'version = ' pyproject.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"

      - name: Check if version changed
        id: check
        run: |
          git diff HEAD~1 HEAD -- pyproject.toml | grep -q '^+version' && CHANGED=true || CHANGED=false
          echo "should_release=$CHANGED" >> $GITHUB_OUTPUT
          echo "Version changed: $CHANGED"

  create-release:
    name: Create GitHub Release
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: v${{ needs.check-version.outputs.version }}
          body: |
            ## Synod CLI v${{ needs.check-version.outputs.version }}

            Install or upgrade:
            ```bash
            pipx upgrade synod-cli
            # or
            pip install synod-cli==${{ needs.check-version.outputs.version }}
            ```

            See [CHANGELOG](https://github.com/KekwanuLabs/synod-cli/commits/main) for details.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Note: PyPI publish happens via publish.yml triggered by release event
      # If that doesn't work, manually run: gh workflow run publish.yml
